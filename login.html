<!DOCTYPE html>
<html>

<head>
<title>Login - Smart Bazaar</title>

<style>

/* BACKGROUND */
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#f8dca7,#e7a93a);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* BOX */
.login-box{
background:white;
padding:30px;
width:350px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
text-align:center;
}

/* TITLE */
.login-box h2{
margin-bottom:20px;
}

/* INPUT */
.login-box input,
.login-box select{
width:100%;
padding:10px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
}

/* BUTTON */
.login-box button{
width:100%;
padding:10px;
background:#d9982a;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

/* LINK */
.link{
margin-top:10px;
font-size:13px;
cursor:pointer;
color:#d9982a;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Login</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<select id="role">
<option value="customer">Customer</option>
<option value="shop">Shop Owner</option>
<option value="admin">Admin</option>
</select>

<button onclick="loginUser()">Login</button>

<p>
Don't have account? <a href="register.html">Register</a>
</p>

</div>

<script src="js/login.js"></script>

</body>
</html>
