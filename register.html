<!DOCTYPE html>
<html>

<head>
<title>Register - Smart Bazaar</title>

<style>

/* BACKGROUND */
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#f8dca7,#e7a93a);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* BOX */
.register-box{
background:white;
padding:30px;
width:350px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
text-align:center;
}

/* TITLE */
.register-box h2{
margin-bottom:20px;
}

/* INPUT */
.register-box input,
.register-box select{
width:100%;
padding:10px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
}

/* BUTTON */
.register-box button{
width:100%;
padding:10px;
background:#d9982a;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

/* LINK */
.link{
margin-top:10px;
font-size:13px;
}

.link a{
color:#d9982a;
text-decoration:none;
}

</style>

</head>

<body>

<div class="register-box">

<h2>Create Account</h2>

<input type="text" id="name" placeholder="Username">

<input type="email" id="email" placeholder="Email">  <!-- 🔥 added -->

<input type="password" id="password" placeholder="Password">

<select id="role">
<option value="customer">Customer</option>
<option value="shop">Shop Owner</option>
</select>

<button onclick="registerUser()">Register</button>

<p class="link">
Already have account? <a href="login.html">Login</a>
</p>

</div>

<script src="js/register.js"></script>

</body>
</html>
